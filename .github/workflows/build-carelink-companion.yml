name: Build CareLink Companion

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write # attach the executable to the release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the Companion sources are committed
        shell: bash
        run: |
          if [ ! -f tools/carelink-companion.js ]; then
            echo "::error::tools/carelink-companion.js is missing. Commit the tools/ folder before building."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CareLink Companion
        run: npm run build:carelink-companion

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: carelink-companion-win-x64
          path: dist/carelink-companion-win-x64.exe
          if-no-files-found: error

      - name: Attach executable to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/carelink-companion-win-x64.exe
